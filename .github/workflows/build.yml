name: Build Replicant303 Multiplatform (macOS, Linux, Windows)

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            cmake_generator: "Xcode"
            artifact_name: "Replicant303-macOS-Universal"

          # Both Linux jobs use the 22.04 image so the two artifacts share one
          # glibc baseline (2.35). The arm64 runner is GitHub's native arm
          # hardware, so arm64 is compiled and tested natively, never
          # cross-compiled.
          - os: ubuntu-22.04
            platform: linux
            cmake_generator: "Unix Makefiles"
            artifact_name: "Replicant303-Linux-x86_64"

          - os: ubuntu-22.04-arm
            platform: linux-arm64
            cmake_generator: "Unix Makefiles"
            artifact_name: "Replicant303-Linux-arm64"

          - os: windows-latest
            platform: windows
            cmake_generator: "Ninja"
            artifact_name: "Replicant303-Windows-x64"

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ------------------------------------------------------------------------
      # MSVC Environment Setup (Windows)
      # ------------------------------------------------------------------------
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # ------------------------------------------------------------------------
      # Linux Dependencies
      # ------------------------------------------------------------------------
      - name: Install Linux Audio & GUI Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libjack-jackd2-dev \
            ladspa-sdk \
            libcurl4-openssl-dev \
            libfreetype6-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxext-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxrender-dev \
            mesa-common-dev \
            libgl1-mesa-dev \
            libgtk-3-dev \
            xvfb

      # ------------------------------------------------------------------------
      # JUCE source cache
      #
      # FetchContent clones JUCE 8.0.4 on every job. The tag is pinned in
      # CMakeLists.txt, so the checkout is immutable and safe to reuse across
      # runs. Keyed per OS and architecture, so no job ever restores another
      # platform's (or another arch's) checkout.
      # ------------------------------------------------------------------------
      - name: Cache JUCE source
        uses: actions/cache@v4
        with:
          path: build/_deps/juce-src
          key: juce-8.0.4-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            juce-8.0.4-${{ runner.os }}-${{ runner.arch }}-

      # ------------------------------------------------------------------------
      # Configure CMake
      # ------------------------------------------------------------------------
      - name: Configure CMake
        run: |
          EXTRA_FLAGS=""
          if [ "${{ matrix.platform }}" = "macos" ]; then
            EXTRA_FLAGS="-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
          fi
          cmake -B build -G "${{ matrix.cmake_generator }}" -DCMAKE_BUILD_TYPE=Release $EXTRA_FLAGS

      # ------------------------------------------------------------------------
      # Build Plugin (VST3, AU, Standalone)
      # ------------------------------------------------------------------------
      - name: Build Targets
        run: |
          cmake --build build --config Release --parallel

      # ------------------------------------------------------------------------
      # Headless Regression Suite (Linux x86_64 and Linux arm64)
      #
      # Runs on both Linux jobs, so the aarch64 build is proven by the suite
      # rather than shipped on the strength of compiling alone.
      # ------------------------------------------------------------------------
      - name: Run Regression Suite
        if: runner.os == 'Linux'
        run: |
          cmake --build build --config Release --target run_tests --parallel
          xvfb-run -a ./build/run_tests

      # ------------------------------------------------------------------------
      # Preset examples must match the checked-in generator output
      # ------------------------------------------------------------------------
      - name: Verify Preset Examples
        if: runner.os == 'Linux'
        run: |
          cmake --build build --config Release --target generate_presets --parallel
          ./build/generate_presets
          if [ -n "$(git status --porcelain -- presets)" ]; then
            echo "::error::presets/ is out of date. Run generate_presets and commit the result."
            git status --porcelain -- presets
            exit 1
          fi

      # ------------------------------------------------------------------------
      # Collect & Package Artifacts
      # ------------------------------------------------------------------------
      - name: Collect & Package Artifacts
        run: |
          mkdir -p package-staging
          
          # Find and copy VST3 bundle
          find build -type d -name "Replicant303.vst3" -exec cp -R {} package-staging/ \; || true
          
          # Find and copy AU bundle (macOS)
          find build -type d -name "Replicant303.component" -exec cp -R {} package-staging/ \; || true
          
          # Find and copy Standalone App / Executable
          find build -type d -name "Replicant303.app" -exec cp -R {} package-staging/ \; || true
          find build -type f -name "Replicant303.exe" -exec cp {} package-staging/ \; || true
          
          # Linux Standalone binary (x86_64 and arm64)
          if [ "${{ matrix.platform }}" = "linux" ] || [ "${{ matrix.platform }}" = "linux-arm64" ]; then
            find build -type f -executable -name "Replicant303" ! -name "*.so" ! -name "*.o" ! -path "*/CMakeFiles/*" -exec cp {} package-staging/ \; || true
          fi

          # Create zip archive
          mkdir -p release-zip
          cd package-staging
          zip -r ../release-zip/${{ matrix.artifact_name }}.zip . || powershell -Command "Compress-Archive -Path * -DestinationPath ../release-zip/${{ matrix.artifact_name }}.zip -Force"
          cd ..

      # ------------------------------------------------------------------------
      # Upload Artifact
      # ------------------------------------------------------------------------
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release-zip/*.zip

  # ----------------------------------------------------------------------------
  # Release Job: Creates a GitHub Release with all platform ZIPs
  # ----------------------------------------------------------------------------
  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    # Releases are cut deliberately, by pushing a version tag, and only then.
    # This used to fire on every push to main, which published a new version
    # for every routine commit and left it unannounced (the X job only runs for
    # tags). Pushing 'v*' is the single act that publishes and announces.
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    # Exported so the notify job can announce without re-deriving the version.
    outputs:
      tag: ${{ steps.versioning.outputs.tag }}
    # Serialise release runs for the same tag, so a re-run and a fresh push of
    # the same version cannot both write the release's assets at once.
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Release Version
        id: versioning
        run: |
          set -euo pipefail

          # The job only runs for refs/tags/v*, so the tag is the version. It
          # is never computed here: guessing the next number is what used to
          # publish one release per commit on main.
          RELEASE_TAG="${GITHUB_REF_NAME}"

          if ! [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '${RELEASE_TAG}' is not a vMAJOR.MINOR.PATCH version. Refusing to publish."
            exit 1
          fi

          # A tag that already has a published release is a republish request
          # (a re-run, or recovering a run that failed after the release step).
          # Reusing the same tag is correct here; creating a new version is not.
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists; refreshing its assets."
          else
            echo "Publishing ${RELEASE_TAG}"
          fi

          echo "tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "${GITHUB_ENV}"
          echo "Release tag will be: ${RELEASE_TAG}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download all Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts

      - name: Prepare Release Files
        run: |
          mkdir -p release-assets
          find downloaded-artifacts -type f -name "*.zip" -exec cp {} release-assets/ \;
          ls -la release-assets

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.tag }}
          name: "Replicant303 ${{ steps.versioning.outputs.tag }} - Multiplatform Release"
          body: |
            ## 🎛️ Replicant303 - Virtual Analog TB-303 Synthesizer (${{ steps.versioning.outputs.tag }})
            **Selectable panel skins (Translucent Green / Obsidian Red) with a 5-model distortion engine**

            ### 📦 Ready-to-use binaries
            * **macOS Universal:** `Replicant303-macOS-Universal.zip` (VST3, AU `.component` and Standalone, for Apple Silicon M1/M2/M3/M4 and Intel)
            * **Linux x86_64:** `Replicant303-Linux-x86_64.zip` (VST3 and Standalone for Ubuntu, Debian, Arch, Fedora)
            * **Linux arm64:** `Replicant303-Linux-arm64.zip` (VST3 and Standalone for Raspberry Pi 4/5, Asahi Linux and other aarch64 systems)
            * **Windows x64:** `Replicant303-Windows-x64.zip` (VST3 and Standalone `.exe` for Windows 10 and 11)

            ### 🎨 Interface
            * Fully procedural 3D front panel: PCB underlay, translucent acrylic chassis, metal knobs, 13-key tactile keyboard and an 80s 7-segment LED tempo clock.
            * **Selectable skins:** Translucent Green (Behringer TD-3) and Obsidian Red (black acrylic, red silkscreen). Choose one from the header selector; the choice is saved with the plugin state.

            ### 🗄️ Preset Vault
            * **8 x 64 presets:** one bank of 64 complete presets per pattern letter `A`-`H` (512 total), with page/slot selection, `GEN`, `STORE`, `IMPORT` and `EXPORT` in the pattern drawer.
            * **Portable `.midi` presets:** every preset is a Standard MIDI File that plays in any DAW and carries the full Replicant303 patch in an embedded metadata event. Plain MIDI patterns import too.
            * The eight original patterns ship as `.midi` examples in `presets/`.

            ### 🚀 Engine
            * Complete virtual analog voice: exponential sawtooth and RC-drooped square wave.
            * 4-pole diode ladder filter with $\tanh$ saturation, AC decoupling and self-oscillation.
            * Interactive twin envelopes with accent shortening and continuous legato slide (~60 ms).
            * **5-model distortion engine:** PocoRat (ProCo Rat with reverse tone filter), TubeDrive, HardClip, Germanium Fuzz and Acid Wavefolder.
          draft: false
          prerelease: false
          files: release-assets/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ----------------------------------------------------------------------------
  # Notify Job: the release itself is the notification channel.
  #
  # A green build that published a release is announced three ways, none of
  # which needs a credential beyond GITHUB_TOKEN:
  #   * a run summary, so the green run says what shipped instead of leaving
  #     you to open the release to find out,
  #   * the release's own atom feed (/releases.atom) for feed readers,
  #   * GitHub's native "Releases only" watch setting for email.
  #
  # It runs only when `release` succeeded, so a failed build never announces.
  # ----------------------------------------------------------------------------
  notify:
    name: Announce Release
    needs: [ build, release ]
    runs-on: ubuntu-latest
    if: needs.release.result == 'success'
    permissions:
      contents: read
      actions: read
    steps:
      - name: Write the release summary
        id: summary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail

          if [[ -z "${TAG:-}" ]]; then
            echo "::warning::release job produced no tag output; announcing the latest release instead"
            # `|| true` keeps a failed lookup from aborting under set -e and
            # silently leaving TAG empty.
            TAG="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName || true)"
          fi

          if [[ -z "$TAG" ]]; then
            echo "::error::Could not determine the released tag."
            exit 1
          fi

          echo "Publishing Replicant303 ${TAG}"

          {
            echo "## 🟢 Replicant303 ${TAG} published"
            echo
            echo "All four platforms built and the release is live."
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Tag | \`${TAG}\` |"
            echo "| Release | https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG} |"
            echo "| Commit | \`${GITHUB_SHA:0:7}\` |"
            echo "| Feed | https://github.com/${GITHUB_REPOSITORY}/releases.atom |"
            echo
            echo "### Assets"
            echo
            gh release view "${TAG}" --repo "$GITHUB_REPOSITORY" \
              --json assets -q '.assets[] | "- `\(.name)` — \(.size / 1048576 | floor) MB"'
          } >> "$GITHUB_STEP_SUMMARY"

          # Surface the tag to any later job without re-deriving it.
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Fail loudly if the release has no binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.summary.outputs.tag }}
        run: |
          set -euo pipefail
          count=$(gh release view "${TAG}" --repo "$GITHUB_REPOSITORY" \
                    --json assets -q '[.assets[] | select(.name | endswith(".zip"))] | length')
          echo "Found ${count} zip asset(s) on ${TAG}"
          # macOS Universal, Linux x86_64, Linux arm64, Windows x64.
          if [[ "${count}" -lt 4 ]]; then
            echo "::error::Expected 4 platform zips on ${TAG}, found ${count}. The release is incomplete."
            exit 1
          fi

  # ----------------------------------------------------------------------------
  # Announce Job: post the release to X.
  #
  # Only runs for a real version tag (refs/tags/v*) whose release succeeded.
  # Pushes to main no longer publish a release at all, so the tag that publishes
  # is always the same tag that announces: one act, one version, one post.
  #
  # X's v2 write endpoint rejects OAuth 2.0 app-only tokens, so the post is
  # signed with OAuth 1.0a inside tools/post_release_tweet.py. The four
  # credentials live in repository secrets and are never written to a file.
  # ----------------------------------------------------------------------------
  announce:
    name: Announce on X
    needs: [ release ]
    runs-on: ubuntu-latest
    if: |
      always() &&
      needs.release.result == 'success' &&
      startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Missing secrets would otherwise fail the post with a confusing 401.
      - name: Check the X credentials are configured
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: |
          set -euo pipefail
          missing=""
          for name in X_API_KEY X_API_SECRET X_ACCESS_TOKEN X_ACCESS_SECRET; do
            [[ -n "${!name:-}" ]] || missing="${missing} ${name}"
          done
          if [[ -n "$missing" ]]; then
            echo "::error::Missing repository secret(s):${missing}. Add them in Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "All four X credentials are present."

      - name: Post the release announcement
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail

          TAG="${TAG:-${GITHUB_REF_NAME}}"
          REPO_URL="https://github.com/${GITHUB_REPOSITORY}"

          # Built with printf so no heredoc indentation leaks into the post.
          # X counts any link as 23 chars, so the text is budgeted against 280
          # minus that; this body comes to ~185.
          TEXT=$(printf '%s\n%s' \
            "Replicant303 ${TAG} is out - free TB-303 emulation: 4-pole diode ladder, 5 distortion models, 512-preset vault. VST3/AU/Standalone for macOS, Windows and Linux (x86_64 + arm64)." \
            "${REPO_URL}/releases/tag/${TAG}")

          python3 tools/post_release_tweet.py "$TEXT"

      - name: Summarise the announcement
        if: always()
        env:
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          {
            echo "### Announcement"
            echo
            echo "- Tag: \`${TAG:-${GITHUB_REF_NAME}}\`"
            echo "- Result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
