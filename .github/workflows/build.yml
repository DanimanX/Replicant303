name: Build Replicant303 Multiplatform (macOS, Linux, Windows)

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            cmake_generator: "Xcode"
            artifact_name: "Replicant303-macOS-Universal"

          - os: ubuntu-22.04
            platform: linux
            cmake_generator: "Unix Makefiles"
            artifact_name: "Replicant303-Linux-x86_64"

          - os: windows-latest
            platform: windows
            cmake_generator: "Ninja"
            artifact_name: "Replicant303-Windows-x64"

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ------------------------------------------------------------------------
      # MSVC Environment Setup (Windows)
      # ------------------------------------------------------------------------
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # ------------------------------------------------------------------------
      # Linux Dependencies
      # ------------------------------------------------------------------------
      - name: Install Linux Audio & GUI Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libjack-jackd2-dev \
            ladspa-sdk \
            libcurl4-openssl-dev \
            libfreetype6-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxext-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxrender-dev \
            mesa-common-dev \
            libgl1-mesa-dev \
            libgtk-3-dev

      # ------------------------------------------------------------------------
      # Configure CMake
      # ------------------------------------------------------------------------
      - name: Configure CMake
        run: |
          EXTRA_FLAGS=""
          if [ "${{ matrix.platform }}" = "macos" ]; then
            EXTRA_FLAGS="-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
          fi
          cmake -B build -G "${{ matrix.cmake_generator }}" -DCMAKE_BUILD_TYPE=Release $EXTRA_FLAGS

      # ------------------------------------------------------------------------
      # Build Plugin (VST3, AU, Standalone)
      # ------------------------------------------------------------------------
      - name: Build Targets
        run: |
          cmake --build build --config Release --parallel

      # ------------------------------------------------------------------------
      # Collect & Package Artifacts
      # ------------------------------------------------------------------------
      - name: Collect & Package Artifacts
        run: |
          mkdir -p package-staging
          
          # Find and copy VST3 bundle
          find build -type d -name "Replicant303.vst3" -exec cp -R {} package-staging/ \; || true
          
          # Find and copy AU bundle (macOS)
          find build -type d -name "Replicant303.component" -exec cp -R {} package-staging/ \; || true
          
          # Find and copy Standalone App / Executable
          find build -type d -name "Replicant303.app" -exec cp -R {} package-staging/ \; || true
          find build -type f -name "Replicant303.exe" -exec cp {} package-staging/ \; || true
          
          # Linux Standalone binary
          if [ "${{ matrix.platform }}" = "linux" ]; then
            find build -type f -executable -name "Replicant303" ! -name "*.so" ! -name "*.o" ! -path "*/CMakeFiles/*" -exec cp {} package-staging/ \; || true
          fi

          # Create zip archive
          mkdir -p release-zip
          cd package-staging
          zip -r ../release-zip/${{ matrix.artifact_name }}.zip . || powershell -Command "Compress-Archive -Path * -DestinationPath ../release-zip/${{ matrix.artifact_name }}.zip -Force"
          cd ..

      # ------------------------------------------------------------------------
      # Upload Artifact
      # ------------------------------------------------------------------------
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release-zip/*.zip

  # ----------------------------------------------------------------------------
  # Release Job: Creates a GitHub Release with all platform ZIPs
  # ----------------------------------------------------------------------------
  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    # Serialise release runs for the same ref. Two pushes landing close together
    # otherwise compute the same next version concurrently and race for one tag.
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Release Version
        id: versioning
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            # Tag push: the version was chosen deliberately, use it as-is.
            RELEASE_TAG="${GITHUB_REF_NAME}"
            echo "Triggered by tag push -> releasing ${RELEASE_TAG}"
          else
            git fetch --tags --force

            # Highest existing version tag, compared as a version.
            #
            # Do NOT use `git describe --tags --abbrev=0` here. When several tags
            # point at the same commit it breaks the tie by repository order, not
            # by version. With v1.0.4 and v1.0.5 both on one commit it returns
            # v1.0.4, so the next version was computed as v1.0.5 again and
            # softprops/action-gh-release silently rewrote that already published
            # release instead of creating a new one.
            LATEST_TAG=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
            LATEST_TAG=${LATEST_TAG:-v1.0.0}
            echo "Highest existing version tag: ${LATEST_TAG}"

            VERSION="${LATEST_TAG#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "${VERSION}"
            # 10# forces decimal: a tag like v1.0.08 would otherwise be read as an
            # invalid octal literal by bash arithmetic and abort the step.
            RELEASE_TAG="v${MAJOR}.${MINOR}.$((10#${PATCH} + 1))"

            # Guard: never write over a release that already exists. Without this
            # the job used to exit 0 while quietly replacing the assets of an
            # older, already published release.
            if git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" >/dev/null; then
              echo "::error::Tag ${RELEASE_TAG} already exists. Refusing to overwrite the published release for it. Bump the version deliberately or delete the stale tag."
              exit 1
            fi
          fi

          echo "tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "${GITHUB_ENV}"
          echo "Release tag will be: ${RELEASE_TAG}"

      - name: Download all Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts

      - name: Prepare Release Files
        run: |
          mkdir -p release-assets
          find downloaded-artifacts -type f -name "*.zip" -exec cp {} release-assets/ \;
          ls -la release-assets

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.tag }}
          name: "Replicant303 ${{ steps.versioning.outputs.tag }} - Multiplatform Release"
          body: |
            ## 🎛️ Replicant303 - Virtual Analog TB-303 Synthesizer (${{ steps.versioning.outputs.tag }})
            **Selectable panel skins (Translucent Green / Obsidian Red) with a 5-model distortion engine**

            ### 📦 Ready-to-use binaries
            * **macOS Universal:** `Replicant303-macOS-Universal.zip` (VST3, AU `.component` and Standalone, for Apple Silicon M1/M2/M3/M4 and Intel)
            * **Linux x86_64:** `Replicant303-Linux-x86_64.zip` (VST3 and Standalone for Ubuntu, Debian, Arch, Fedora)
            * **Windows x64:** `Replicant303-Windows-x64.zip` (VST3 and Standalone `.exe` for Windows 10 and 11)

            ### 🎨 Interface
            * Fully procedural 3D front panel: PCB underlay, translucent acrylic chassis, metal knobs, 13-key tactile keyboard and an 80s 7-segment LED tempo clock.
            * **Selectable skins:** Translucent Green (Behringer TD-3) and Obsidian Red (black acrylic, red silkscreen). Choose one from the header selector; the choice is saved with the plugin state.

            ### 🚀 Engine
            * Complete virtual analog voice: exponential sawtooth and RC-drooped square wave.
            * 4-pole diode ladder filter with $\tanh$ saturation, AC decoupling and self-oscillation.
            * Interactive twin envelopes with accent shortening and continuous legato slide (~60 ms).
            * **5-model distortion engine:** PocoRat (ProCo Rat with reverse tone filter), TubeDrive, HardClip, Germanium Fuzz and Acid Wavefolder.
          draft: false
          prerelease: false
          files: release-assets/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
